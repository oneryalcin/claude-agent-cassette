[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-agent-cassette"
dynamic = ["version"]  # single source of truth: __init__.__version__ (see [tool.hatch.version])
description = "Record & replay the claude-agent-sdk wire for deterministic, offline tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mehmet Öner Yalçın" }]
keywords = ["claude", "claude-agent-sdk", "testing", "vcr", "cassette", "replay"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Pinned to the tested range: record mode touches claude_agent_sdk._internal,
    # which can change across minor versions. Replay rides the public Transport ABC.
    "claude-agent-sdk>=0.2.82,<0.2.143",
    # MCP 2 changes the in-process protocol used by stub and verify replay.
    # Keep fresh installs on the tested protocol until MCP 2 support is added.
    "mcp>=1,<2",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "mypy==2.1.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff==0.15.16",
]

[project.urls]
Homepage = "https://github.com/oneryalcin/claude-agent-cassette"

[project.scripts]
claude-agent-cassette = "claude_agent_cassette.cli:main"

[project.entry-points.pytest11]
claude_agent_cassette = "claude_agent_cassette.pytest_plugin"

[tool.hatch.version]
path = "src/claude_agent_cassette/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agent_cassette"]

# Source releases are built from an explicit allowlist. Hatchling otherwise
# includes every VCS-unignored file in the working tree, which can publish
# local tool state when a release is built from a dirty checkout.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "ROADMAP.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

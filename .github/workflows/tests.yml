name: tests

# The test matrix is the drift tripwire for the one coupling the library *emits*
# rather than reads: the hand-synthesised control-protocol handshake
# (`_control_response`). Drift detection watches message frames through the SDK
# parser, but the handshake bypasses the parser — so a future SDK that changes the
# control_response contract would make `connect()` hang *silently* in production.
# Running the real-client connect() tests across several claude-agent-sdk versions
# turns that silent hang into a loud, early failure here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py3.12 · sdk-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["0.2.82", "0.2.87", "latest"]  # floor pin · mid · floating latest 0.2.x
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install library + dev deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Pin claude-agent-sdk for this matrix cell
        run: |
          if [ "${{ matrix.sdk }}" = "latest" ]; then
            uv pip install -U "claude-agent-sdk>=0.2,<0.3"
          else
            uv pip install "claude-agent-sdk==${{ matrix.sdk }}"
          fi
      - name: Resolved SDK (the version this cell guards)
        run: .venv/bin/python -c "import claude_agent_sdk as c; print('claude-agent-sdk', c.__version__)"
      - name: Tests (includes the connect() handshake tripwire)
        run: .venv/bin/python -m pytest -q

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          uv venv
          uv pip install -e ".[dev]" ruff mypy
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/mypy src/claude_agent_cassette
